name: Scheduled HH.ru collection

on:
  schedule:
    # Every 6 hours (UTC): 00:00, 06:00, 12:00, 18:00.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hhru-scheduled-collection
  cancel-in-progress: false

jobs:
  collect:
    name: Collect vacancies from HH.ru
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: hh-bigdata
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hh-bigdata/requirements.txt

      - name: Validate database and HH.ru configuration
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          HH_API_TOKEN: ${{ secrets.HH_API_TOKEN }}
        run: |
          set -euo pipefail
          for name in DB_HOST DB_NAME DB_USER DB_PASSWORD HH_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Actions secret $name is missing."
              exit 1
            fi
          done

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        env:
          DB_BACKEND: postgres
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT || '5432' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
        run: python -m src.pipeline migrate

      - name: Collect HH.ru vacancies and load PostgreSQL
        env:
          DB_BACKEND: postgres
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT || '5432' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          HH_API_TOKEN: ${{ secrets.HH_API_TOKEN }}
          COLLECT_QUERIES: ${{ vars.COLLECT_QUERIES }}
          COLLECT_AREAS: ${{ vars.COLLECT_AREAS }}
          COLLECT_PER_PAGE: ${{ vars.COLLECT_PER_PAGE || '50' }}
          COLLECT_MAX_PAGES: ${{ vars.COLLECT_MAX_PAGES || '5' }}
          COLLECT_MAX_VACANCIES: ${{ vars.COLLECT_MAX_VACANCIES || '500' }}
          COLLECT_FETCH_DETAILS: ${{ vars.COLLECT_FETCH_DETAILS || 'true' }}
          COLLECT_DELAY_SEC: ${{ vars.COLLECT_DELAY_SEC || '0.5' }}
          COLLECT_TIMEOUT_SEC: ${{ vars.COLLECT_TIMEOUT_SEC || '20' }}
          COLLECT_MAX_RETRIES: ${{ vars.COLLECT_MAX_RETRIES || '4' }}
          COLLECT_MAX_REQUESTS: ${{ vars.COLLECT_MAX_REQUESTS || '1500' }}
          COLLECT_PERIOD_DAYS: ${{ vars.COLLECT_PERIOD_DAYS }}
        run: |
          set -euo pipefail
          echo "Starting HH.ru collection directly on GitHub Actions runner..."
          python -m src.pipeline collect

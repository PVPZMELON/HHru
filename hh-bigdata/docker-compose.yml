services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-hh_market}
      POSTGRES_USER: ${DB_USER:-hh_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hh_user} -d ${DB_NAME:-hh_market}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DB_BACKEND: postgres
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    command: >
      sh -c "python -m src.pipeline migrate &&
             streamlit run src/dashboard/app.py --server.address=0.0.0.0 --server.port=8501"

volumes:
  pgdata:
